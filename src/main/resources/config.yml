# Bots4Velo multi-protocol headless client
#
# This starter configuration intentionally contains no bots.
# Create persistent bots in-game with:
#   /vbot create <id> <username> <secret:name|env:NAME|-> [target-server|-]
#
# A newly created bot is saved to managed-bots.yml. Passwords stay in
# plugins/bots4velo/secrets.yml or in the Velocity process environment.

proxy:
  address: "127.0.0.1"
  port: 25565
  # The host and port written into the Minecraft handshake.
  virtual-host: "localhost"
  virtual-port: 25565
  # AUTO pings the selected backend. Manual values: 1.16.5, 1.21.11,
  # 26.1.2, 26.2 or 26.3.
  protocol-version: "AUTO"
  protocol-detection-timeout-ms: 3000

runtime:
  auto-start-delay-ms: 3000
  # Hard cap for static bots plus bots created with /vbot create.
  maximum-bots: 32
  # Global connection and command rate limits.
  spawn-interval-ms: 1500
  command-interval-ms: 750
  resource-pack-step-delay-ms: 150
  resource-pack-mode: "ACCEPT_WITHOUT_DOWNLOAD"
  auto-respawn: true

  # Optional authenticated control of the Bots4Velo Paper companion.
  # Keep disabled until the companion is installed on every target backend.
  backend-control:
    enabled: false
    secret: ""
    secret-env: ""
    timeout-ms: 3000

  reconnect:
    initial-delay-ms: 5000
    maximum-delay-ms: 60000
    multiplier: 2.0
    jitter: 0.15
    # Zero means retry forever.
    maximum-attempts: 0
    # Reset a finite retry budget only after authenticated PLAY is stable.
    stable-reset-seconds: 30

  # Optional scheduled actions, webhooks, presence rules and Prometheus.
  schedules: []
  webhook-url: ""
  prometheus-address: "127.0.0.1"
  prometheus-port: 0
  presence-rules: []

# Optional templates for hand-written static bots. Runtime-created bots use
# the safe defaults from /vbot create and are stored in managed-bots.yml.
templates: {}

# Deliberately empty: use /vbot create instead of editing this section.
bots: {}
