name: Build patch release

# Minor and patch releases are started by hand. Major vX.0.0 releases keep
# their tag-triggered workflow in build-major-release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, e.g. 3.0.9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/build.yml

  build-and-release:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Validate the requested version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          [[ ! "$VERSION" =~ ^[0-9]+\.0\.0$ ]] || { echo "Major releases use build-major-release.yml" >&2; exit 1; }

      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Test and build release JAR
        run: ./gradlew clean test shadowJar -PpluginVersion="$VERSION"

      - name: Verify the shaded release JAR
        run: ./gradlew verifyShadowJar -PpluginVersion="$VERSION"

      - name: Generate artifact checksum
        run: ./gradlew writeArtifactChecksum -PpluginVersion="$VERSION"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bots4velo-v${{ inputs.version }}
          path: build/libs/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [[ -f "docs/releases/v$VERSION.md" ]]; then
            notes=(--notes-file "docs/releases/v$VERSION.md")
          fi
          gh release create "v$VERSION" build/libs/*.jar build/libs/*.sha256 \
            --target "$GITHUB_SHA" --title "Bots4Velo v$VERSION" "${notes[@]}"
